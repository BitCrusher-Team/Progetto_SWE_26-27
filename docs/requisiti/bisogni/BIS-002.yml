text: |
  Var Group vuole attribuire costi e consumi dell'IA a chi li genera. Il capitolato indica team, progetto e utente; nell'incontro del 2026-11-23 Var Group ha ristretto le dimensioni a utente e team, escludendo organizzazione e progetto perché richiederebbero una configurazione manuale.

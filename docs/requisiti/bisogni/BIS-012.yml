text: |
  Ogni elemento in cache deve avere una retention. Un amministratore della cache deve poter far scadere gli elementi o prolungarne la retention, anche per eliminare un dato sensibile finito in cache. La retention deve essere verificabile alla fine del flusso, in produzione.

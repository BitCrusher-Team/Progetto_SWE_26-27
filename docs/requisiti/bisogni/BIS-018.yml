text: |
  Il risparmio non deve essere totale: va bilanciato con l'accuratezza. Un risparmio del 50% è più che buono con un'accuratezza alta: almeno l'80% secondo gli appunti di gruppo, 90 casi giusti su 100 secondo gli appunti di Alex Singh.

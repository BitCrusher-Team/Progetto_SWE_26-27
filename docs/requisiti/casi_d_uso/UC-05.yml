text: |
  **Obiettivo.** L'[utente](gls:utente) toglie dal sistema risposte alle proprie richieste che non vuole siano conservate.

  **Precondizioni.** L'utente è autenticato presso il sistema.

  **Trigger.** L'utente sceglie di eliminare elementi.

  **Postcondizioni.** Gli [elementi conservati](gls:elemento-conservato) scelti non sono più [validi](gls:elemento-valido) e non compaiono più nell'elenco.

  **Scenario principale.**
  1. L'utente seleziona, tra i propri elementi conservati (UC-04, incluso), quelli da eliminare.
  2. L'utente conferma l'eliminazione.
  3. Il sistema elimina gli elementi e conferma l'esito.

  **Scenari alternativi.**
  - **2a.** L'utente annulla: nessuna modifica. Fine.

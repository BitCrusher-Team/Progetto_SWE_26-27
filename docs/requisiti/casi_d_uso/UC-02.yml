text: |
  **Obiettivo.** L'[utente](gls:utente) decide se alle proprie [richieste di primo turno](gls:richiesta-di-primo-turno) può essere restituito il contenuto di un [elemento conservato](gls:elemento-conservato), così da ricevere risposte immediate oppure sempre generate dal modello.

  **Precondizioni.** L'utente è autenticato presso il sistema.

  **Trigger.** L'utente apre le proprie impostazioni.

  **Postcondizioni.** L'[impostazione di riuso](gls:impostazione-di-riuso) dell'utente ha il valore scelto.

  **Scenario principale.**
  1. Il sistema mostra l'impostazione di riuso dell'utente e l'[impostazione effettiva](gls:impostazione-effettiva) di riuso.
  2. L'utente attiva o disattiva l'impostazione di riuso.
  3. Il sistema registra il nuovo valore e mostra l'impostazione effettiva risultante.

  **Scenari alternativi.**
  - **1a.** L'[amministratore LiteLLM](gls:amministratore-litellm) ha disattivato il riuso per l'utente o per il suo team: il sistema lo indica insieme all'impostazione effettiva. L'utente può comunque cambiare la propria impostazione, che avrà effetto quando l'amministratore revocherà la disattivazione.

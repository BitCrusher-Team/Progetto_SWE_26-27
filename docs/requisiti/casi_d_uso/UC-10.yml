text: |
  **Obiettivo.** L'[amministratore LiteLLM](gls:amministratore-litellm) stabilisce per quanto tempo restano riusabili i nuovi [elementi conservati](gls:elemento-conservato), per tutti i team o per un singolo [team](gls:team).

  **Precondizioni.** L'amministratore è autenticato come amministratore di LiteLLM.

  **Trigger.** L'amministratore sceglie di cambiare la [retention](gls:retention) predefinita.

  **Postcondizioni.** La nuova retention predefinita vale per gli elementi conservati da quel momento.

  **Scenario principale.**
  1. L'amministratore sceglie se impostare la retention per tutti i team o per un team.
  2. L'amministratore inserisce la durata.
  3. Il sistema registra la durata.

  **Scenari alternativi.**
  - **2a.** La durata non è positiva: il sistema la rifiuta e lo indica. Si torna al passo 2.

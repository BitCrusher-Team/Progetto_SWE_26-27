# Livelli dei glossari e documenti Doorstop che li usano.
# Un livello eredita le voci dei livelli da cui discende: un testo può citare
# (con un collegamento gls:<id>) solo voci del proprio livello o degli antenati.
sito: https://bitcrusher-team.github.io/Progetto_SWE_26-27/

livelli:
  progetto:
    file: docs/tex/glossario/Glossario.tex
    pdf: docs/compiled/glossario/Glossario.pdf
    eredita: null
    documenti: []
  c6-casi-d-uso:
    file: docs/tex/glossario/Glossario_Casi_d_uso.tex
    pdf: docs/compiled/glossario/Glossario_Casi_d_uso.pdf
    eredita: progetto
    documenti: [BIS, UC]

# Voci del Glossario di progetto che descrivono una soluzione: appartengono
# alla progettazione, quindi i testi di casi d'uso e requisiti non le citano
# né le nominano. Quando nasce il glossario di progettazione si spostano lì,
# con lo stesso id.

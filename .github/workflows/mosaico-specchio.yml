# Mosaico: lo specchio OpenProject -> GitHub. GitHub LEGGE OpenProject e lo copia: una issue per
# carta (titolo, stato di lavoro, tipo, ruolo, categoria, priorita', documento, stima, avanzamento, date, artefatti, tutti
# i legami fra le carte e la gerarchia), una milestone per sprint (obiettivo e date), gli assegnatari, aperta o chiusa.
# OpenProject non chiama mai GitHub. Una issue speculare porta un marcatore nascosto; le modifiche fatte qui si riscrivono al giro
# dopo, i commenti restano.
# I login GitHub vengono da .github/mosaico/membri.yml.
name: Mosaico, specchio

on:
  schedule:
    - cron: "*/15 3-21 * * *"  # in UTC: copre la finestra italiana d'inverno e d'estate; decide il passo degli orari
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo prova: legge e dice cosa scriverebbe, senza scrivere"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: mosaico-specchio
  cancel-in-progress: false

jobs:
  specchio:
    name: Specchio di OpenProject
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Il server di OpenProject e' spento di notte: fuori dalla finestra non si prova nemmeno.
      - name: Gli orari del server
        id: orari
        env:
          DA: ${{ vars.MOSAICO_ACCESO_DA || '0530' }}
          A: ${{ vars.MOSAICO_ACCESO_A || '2215' }}
        run: |
          ora=$(TZ=Europe/Rome date +%H%M)
          if (( 10#$ora >= 10#$DA && 10#$ora < 10#$A )); then
            echo "acceso=si" >> "$GITHUB_OUTPUT"
          else
            echo "acceso=no" >> "$GITHUB_OUTPUT"
            echo "::notice::sono le $ora (ora italiana): il server di OpenProject e' acceso dalle $DA alle $A"
          fi

      - name: I segreti e la variabile
        if: steps.orari.outputs.acceso == 'si'
        env:
          STRUMENTI_SSH_KEY: ${{ secrets.STRUMENTI_SSH_KEY }}
          OP_URL: ${{ secrets.OP_URL }}
          OP_TOKEN: ${{ secrets.OP_TOKEN }}
          MOSAICO_PROGETTO: ${{ vars.MOSAICO_PROGETTO }}
        run: |
          mancano=""
          for n in STRUMENTI_SSH_KEY OP_URL OP_TOKEN MOSAICO_PROGETTO; do [ -n "${!n}" ] || mancano="$mancano $n"; done
          if [ -n "$mancano" ]; then
            echo "::error::mancano nel repo:$mancano (Settings, Secrets and variables, Actions: i primi tre sono segreti, MOSAICO_PROGETTO e' una variabile)"
            exit 1
          fi
          echo "segreti e variabile: presenti"
          # la forma del token, mai il token: si confronta con quella del token di mosaico-bot
          python3 - <<'PY'
          import hashlib, os
          t = os.environ["OP_TOKEN"]
          s = t.strip()
          print(f"OP_TOKEN: {len(s)} caratteri, prefisso opapi-: {s.startswith('opapi-')}, spazi attorno: {s != t}, "
                f"impronta {hashlib.sha256(s.encode()).hexdigest()[:12]}")
          if s.lower().startswith("bearer"):
              print("::error::OP_TOKEN comincia con «Bearer»: va solo il token")
              raise SystemExit(1)
          PY

      - name: La deploy key apre strumenti?
        if: steps.orari.outputs.acceso == 'si'
        env:
          CHIAVE: ${{ secrets.STRUMENTI_SSH_KEY }}
          REPO: ${{ github.repository_owner }}/strumenti
        run: |
          k=$(mktemp); trap 'rm -f "$k"' EXIT
          case "$CHIAVE" in *$'\r'*) echo "::warning::STRUMENTI_SSH_KEY contiene a capo di Windows (CR): qui si tolgono, ma il checkout potrebbe non leggerla. Meglio rimetterla copiata da un terminale Linux o Termux" ;; esac
          printf '%s\n' "$CHIAVE" | tr -d '\r' > "$k"; chmod 600 "$k"
          if ! ssh-keygen -y -f "$k" > /dev/null 2>&1; then
            echo "::error::STRUMENTI_SSH_KEY non e' una chiave privata leggibile: incollata a meta', senza le righe BEGIN/END, o e' la pubblica?"
            exit 1
          fi
          echo "impronta della chiave privata: $(ssh-keygen -l -f "$k" | cut -d' ' -f2) (deve essere quella della deploy key di $REPO)"
          if out=$(GIT_SSH_COMMAND="ssh -i $k -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" git ls-remote "git@github.com:$REPO.git" HEAD 2>&1); then
            [ -n "$out" ] && echo "$REPO: si legge" || { echo "::error::$REPO e' vuoto: manca il push del codice di Mosaico"; exit 1; }
          else
            echo "::error::git non legge $REPO: $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-300)"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.orari.outputs.acceso == 'si'
        with:
          sparse-checkout: .github/mosaico
          persist-credentials: false

      - uses: actions/checkout@v4
        if: steps.orari.outputs.acceso == 'si'
        with:
          repository: ${{ github.repository_owner }}/strumenti
          ssh-key: ${{ secrets.STRUMENTI_SSH_KEY }}
          path: strumenti
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.orari.outputs.acceso == 'si'
        with:
          python-version: "3.12"

      - name: Mosaico
        if: steps.orari.outputs.acceso == 'si'
        run: python -m pip install --quiet ./strumenti

      - name: Un giro dello specchio
        if: steps.orari.outputs.acceso == 'si'
        env:
          OP_URL: ${{ secrets.OP_URL }}
          OP_TOKEN: ${{ secrets.OP_TOKEN }}
          MOSAICO_PROGETTO: ${{ vars.MOSAICO_PROGETTO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVA: ${{ inputs.prova && '--prova' || '' }}
        run: python -m mosaico specchio --membri .github/mosaico/membri.yml $PROVA

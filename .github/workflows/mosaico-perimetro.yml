# Mosaico: il controllo del perimetro delle PR. A ogni
# `git spr update` confronta i file che la PR cambia con gli artefatti delle carte citate nella descrizione (OP#n),
# lette da OpenProject col token di sola lettura. Un file scoperto fa fallire il controllo, con un'annotazione sul file
# (o la PR tocca troppo, o la carta dichiara troppo poco); un file conteso (dichiarato anche da un'altra colonna) avvisa.
name: Mosaico, perimetro

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mosaico-perimetro-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  perimetro:
    name: Mosaico
    # le PR da un fork non hanno i segreti
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Il server di OpenProject e' spento di notte: fuori dalla finestra non si prova nemmeno.
      - name: Gli orari del server
        id: orari
        env:
          DA: ${{ vars.MOSAICO_ACCESO_DA || '0530' }}
          A: ${{ vars.MOSAICO_ACCESO_A || '2215' }}
        run: |
          ora=$(TZ=Europe/Rome date +%H%M)
          if (( 10#$ora >= 10#$DA && 10#$ora < 10#$A )); then
            echo "acceso=si" >> "$GITHUB_OUTPUT"
          else
            echo "acceso=no" >> "$GITHUB_OUTPUT"
            echo "::notice::sono le $ora (ora italiana): il server di OpenProject e' acceso dalle $DA alle $A"
          fi

      - name: Di notte il server e' spento
        if: steps.orari.outputs.acceso == 'no'
        run: |
          echo "::error::il server di OpenProject e' spento a quest'ora: lo rilancia da solo il workflow «Mosaico, mattino», o lo si rilancia a mano dopo le 5:30"
          exit 1

      - name: I segreti e la variabile
        if: steps.orari.outputs.acceso == 'si'
        env:
          STRUMENTI_SSH_KEY: ${{ secrets.STRUMENTI_SSH_KEY }}
          OP_URL: ${{ secrets.OP_URL }}
          OP_TOKEN: ${{ secrets.OP_TOKEN }}
          MOSAICO_PROGETTO: ${{ vars.MOSAICO_PROGETTO }}
        run: |
          mancano=""
          for n in STRUMENTI_SSH_KEY OP_URL OP_TOKEN MOSAICO_PROGETTO; do [ -n "${!n}" ] || mancano="$mancano $n"; done
          if [ -n "$mancano" ]; then
            echo "::error::mancano nel repo:$mancano (Settings, Secrets and variables, Actions: i primi tre sono segreti, MOSAICO_PROGETTO e' una variabile)"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.orari.outputs.acceso == 'si'
        with:
          repository: ${{ github.repository_owner }}/strumenti
          ssh-key: ${{ secrets.STRUMENTI_SSH_KEY }}
          path: strumenti
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.orari.outputs.acceso == 'si'
        with:
          python-version: "3.12"

      - name: Mosaico
        if: steps.orari.outputs.acceso == 'si'
        run: python -m pip install --quiet ./strumenti

      - name: Il perimetro della PR
        if: steps.orari.outputs.acceso == 'si'
        env:
          OP_URL: ${{ secrets.OP_URL }}
          OP_TOKEN: ${{ secrets.OP_TOKEN }}
          MOSAICO_PROGETTO: ${{ vars.MOSAICO_PROGETTO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m mosaico perimetro

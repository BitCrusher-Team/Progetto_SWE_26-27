name: CI

on:
  pull_request:
    # Niente filtro sul branch base: la CI gira anche sulle stacked PR (base spr/*).
    # NOTA: ora rilancia il check anche quando cambia il titolo o il branch base.
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida il titolo della PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
          ACTION: ${{ github.event.action }}
          OLD_TITLE: ${{ github.event.changes.title.from }}
        run: |
          # git spr merge, subito prima del merge, riscrive il titolo con l'headline
          # che GitHub tronca oltre 72 caratteri ("…" in fondo, il resto nel body).
          # Se l'unica modifica è quel troncamento, si valida il titolo completo
          # precedente: con squash "Default message" è il subject che arriva sul main.
          if [[ "$ACTION" == edited && -n "$OLD_TITLE" ]]; then
            stem=${TITLE%…}; stem=${stem%...}
            if [[ "$stem" != "$TITLE" && "$OLD_TITLE" == "$stem"* ]]; then
              echo "Titolo troncato da GitHub: valido il titolo completo precedente."
              TITLE=$OLD_TITLE
            fi
          fi

          # Formato: uno o più segmenti separati da "; ", titolo che termina con ".".
          # Segmento: tipo(scope)!: descrizione   (scope e "!" opzionali)
          # Descrizione: non inizia con maiuscola o spazio, non termina con spazio,
          # non contiene ";" (riservato al separatore). Punti, ":", "/" ammessi.
          export LC_ALL=C
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          seg_re="^(${types})(\([A-Za-z0-9_./+-]+\))?!?: [^A-Z[:space:];]([^;]*[^[:space:];])?\$"

          fail() {
            echo "::error title=Titolo PR non valido::$1"
            echo "Formato atteso: tipo(scope): descrizione; tipo2: descrizione2."
            echo "Tipi validi: ${types//|/ }"
            exit 1
          }

          [[ "$TITLE" == *. ]] || fail "il titolo deve terminare con '.'"
          rest=${TITLE%.}
          n=0
          while :; do
            seg=${rest%%; *}
            n=$((n + 1))
            [[ "$seg" =~ $seg_re ]] || fail "segmento $n non valido: '$seg'"
            [[ "$rest" == *"; "* ]] || break
            rest=${rest#*; }
          done
          echo "Titolo valido ($n segmenti)."

name: CI

on:
  pull_request:
    # Niente filtro sul branch base: la CI gira anche sulle PR impilate (base spr/*).
    # edited: rilancia il check quando cambia il titolo o il branch base (retarget).
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Valida il titolo della PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Formato: uno o più segmenti separati da "; ", titolo che termina con ".".
          # Segmento: tipo(scope)!: descrizione   (scope e "!" opzionali)
          # Descrizione: non inizia con maiuscola o spazio, non termina con spazio,
          # non contiene ";" (riservato al separatore). Punti, ":", "/" ammessi.
          # Lunghezza in char (non byte): non oltre 72 perchè GH tronca il subject
          # con '...' e sposta il resto nel body.
          LC_ALL=C.UTF-8
          len=${#TITLE}
          export LC_ALL=C
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          seg_re="^(${types})(\([A-Za-z0-9_./+-]+\))?!?: [^A-Z[:space:];]([^;]*[^[:space:];])?\$"
 
          fail() {
            echo "::error title=Titolo PR non valido::$1"
            echo "Formato atteso: tipo(scope): descrizione; tipo2: descrizione2."
            echo "Tipi validi: ${types//|/ }"
            exit 1
          }
 
          (( len <= 72 )) || fail "titolo di $len caratteri (max 72): accorcia il subject del commit, i dettagli vanno nel body"
          [[ "$TITLE" == *. ]] || fail "il titolo deve terminare con '.'"
          rest=${TITLE%.}
          n=0
          while :; do
            seg=${rest%%; *}
            n=$((n + 1))
            [[ "$seg" =~ $seg_re ]] || fail "segmento $n non valido: '$seg'"
            [[ "$rest" == *"; "* ]] || break
            rest=${rest#*; }
          done
          echo "Titolo valido ($n segmenti)."

name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PR title (multi-commit conventional)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Pattern: uno o più commit separati da ';', messaggio che termina con '.'
          # Ogni commit: type(scope): desc  OPPURE  type: desc
          # type: vedi lista nel pattern
          # scope: opzionale, tra parentesi ()
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./+-]+\))?!?: [a-z][^.]*((; )(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./+-]+\))?!?: [a-z][^.]*)*\.$'
          
          if ! echo "$TITLE" | grep -qE "$PATTERN"; then
            echo "::error::PR title must follow multi-commit format:"
            echo "e.g.  type(scope): description; type2: description2."
            echo "      Valid types: feat fix docs style refactor perf test build ci chore revert"
            exit 1
          fi
